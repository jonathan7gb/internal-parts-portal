openapi: 3.0.3
info:
  title: Internal Parts Portal — Orders Module
  description: API de gestão do ciclo de vida de pedidos de peças internas.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local

security:
  - bearerAuth: []

tags:
  - name: Orders
    description: Operações do módulo de pedidos

paths:

  /orders:
    post:
      tags: [Orders]
      summary: Criar pedido
      description: >
        Cria um novo pedido. Valida disponibilidade de estoque de forma síncrona
        para cada item antes de persistir. Publica `PedidoCriadoEvent` ao concluir.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              justification: "Manutenção preventiva da linha 3"
              items:
                - partId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  quantity: 5
      responses:
        '201':
          description: Pedido criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '422':
          description: Estoque insuficiente para um ou mais itens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockUnavailableError'
              example:
                message: "Estoque insuficiente para um ou mais itens"
                unavailableItems:
                  - partId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    partCode: "PARAFUSO-M8"
                    requested: 5
                    available: 2
      security:
        - bearerAuth: [COLABORADOR]

    get:
      tags: [Orders]
      summary: Listar próprios pedidos
      description: Retorna apenas os pedidos do colaborador autenticado.
      operationId: listMyOrders
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Lista paginada de pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
      security:
        - bearerAuth: [COLABORADOR]

  /orders/pending:
    get:
      tags: [Orders]
      summary: Fila de pedidos pendentes
      description: Lista todos os pedidos com status `PENDENTE` aguardando aprovação.
      operationId: listPendingOrders
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Lista paginada de pedidos pendentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
      security:
        - bearerAuth: [APROVADOR]

  /orders/approved:
    get:
      tags: [Orders]
      summary: Fila de pedidos aprovados
      description: Lista todos os pedidos com status `APROVADO` aguardando separação física.
      operationId: listApprovedOrders
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Lista paginada de pedidos aprovados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
      security:
        - bearerAuth: [ALMOXARIFE]

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Detalhe do pedido
      description: >
        Retorna os detalhes de um pedido específico.
        COLABORADOR só acessa os próprios pedidos.
      operationId: getOrderById
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '403':
          description: COLABORADOR tentando acessar pedido de outro usuário
        '404':
          description: Pedido não encontrado
      security:
        - bearerAuth: [COLABORADOR, APROVADOR, ALMOXARIFE, ADMIN]

  /orders/{id}/approve:
    post:
      tags: [Orders]
      summary: Aprovar pedido
      description: >
        Aprova um pedido com status `PENDENTE`.
        Publica `PedidoAprovadoEvent`.
      operationId: approveOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido aprovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Pedido não encontrado
        '409':
          description: Pedido não está com status PENDENTE
      security:
        - bearerAuth: [APROVADOR]

  /orders/{id}/reject:
    post:
      tags: [Orders]
      summary: Rejeitar pedido
      description: >
        Rejeita um pedido com status `PENDENTE`. Requer justificativa.
        Publica `PedidoRejeitadoEvent`.
      operationId: rejectOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectOrderRequest'
            example:
              rejectionNote: "Estoque reposto na próxima semana, favor reabrir."
      responses:
        '200':
          description: Pedido rejeitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: rejectionNote ausente ou inválido
        '404':
          description: Pedido não encontrado
        '409':
          description: Pedido não está com status PENDENTE
      security:
        - bearerAuth: [APROVADOR]

  /orders/{id}/complete:
    post:
      tags: [Orders]
      summary: Concluir pedido
      description: >
        Marca um pedido `APROVADO` como concluído após a separação física.
        Publica `PedidoConcluidoEvent`.
      operationId: completeOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido concluído
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Pedido não encontrado
        '409':
          description: Pedido não está com status APROVADO
      security:
        - bearerAuth: [ALMOXARIFE]

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20

  schemas:

    OrderStatus:
      type: string
      enum: [PENDENTE, APROVADO, REJEITADO, CONCLUIDO]

    CreateOrderRequest:
      type: object
      required: [justification, items]
      properties:
        justification:
          type: string
          minLength: 10
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    OrderItemRequest:
      type: object
      required: [partId, quantity]
      properties:
        partId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    RejectOrderRequest:
      type: object
      required: [rejectionNote]
      properties:
        rejectionNote:
          type: string
          minLength: 10

    OrderItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partId:
          type: string
          format: uuid
        partCode:
          type: string
          example: PARAFUSO-M8
        partName:
          type: string
          example: Parafuso M8 x 20mm
        quantity:
          type: integer

    OrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        justification:
          type: string
        rejectionNote:
          type: string
          nullable: true
        requesterId:
          type: string
          format: uuid
        reviewedBy:
          type: string
          format: uuid
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'

    OrderPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrderResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer
        number:
          type: integer

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    StockUnavailableError:
      type: object
      properties:
        message:
          type: string
        unavailableItems:
          type: array
          items:
            type: object
            properties:
              partId:
                type: string
                format: uuid
              partCode:
                type: string
              requested:
                type: integer
              available:
                type: integer
